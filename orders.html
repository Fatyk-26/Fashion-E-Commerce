
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <title>My Orders | Fashion Store</title>
</head>

<body>
    <div id="header"></div>
    <main class="min-h-screen bg-gray-50 pt-24 pb-20 px-4">
        <div class="max-w-6xl mx-auto">
            <div class="mb-10">
                <h1 class="text-3xl font-semibold text-slate-900">
                    My Orders
                </h1>
                <p class="text-gray-500 mt-2">
                    Track and review your orders.
                </p>
            </div>

            <div id="orders-loading"
                class="text-center py-16 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
                <p class="mt-3">Loading your orders...</p>
            </div>

            <div id="orders-error"
                role="alert"
                class="hidden bg-red-50 text-red-700 rounded-xl p-4 mb-6">
            </div>

            <div id="orders-empty"
                class="hidden bg-white border border-gray-200 rounded-2xl text-center py-16 px-6">
                <i class="fa-solid fa-box-open text-5xl text-gray-300"></i>

                <h2 class="text-xl font-semibold mt-5">
                    No Orders Yet
                </h2>

                <p class="text-gray-500 mt-2">
                    Your orders will appear here after checkout.
                </p>

                <a href="shop.html"
                    class="inline-block mt-6 bg-olive-800 text-white px-6 py-3 rounded-xl hover:opacity-85">
                    Start Shopping
                </a>
            </div>
            
            <div id="orders-list" class="flex flex-col gap-6"></div>
        </div>
    </main>

<div id="footer"></div>

<script src="./js/header.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/orders.js"></script>

</body>
</html>
