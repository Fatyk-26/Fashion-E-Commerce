
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./src/output.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<title>Order Confirmed | Fashion Store</title>
</head>

<body>
    <div id="header"></div>
    <main class="min-h-[70vh] flex items-center justify-center px-4 py-29 ">
        <section class="w-full max-w-xl text-center  border border-gray-200 rounded-2xl p-8 md:p-12">
            <div class="mx-auto w-20 h-20 rounded-full bg-green-50 flex items-center justify-center mb-6">
                <i class="fa-solid fa-check text-4xl text-green-700"></i>
            </div>

            <h1 class="text-3xl font-semibold text-slate-900">
                Thank You for Your Order!
            </h1>

            <p class="text-gray-500 mt-4 leading-7">
                Your order has been placed successfully.
                Thank you for shopping with Fashion Store.
            </p>

            <div class="bg-gray-50 rounded-xl p-4 mt-8">
                <p class="text-sm text-gray-500"> Your Order Number</p>
                <p id="order-number"  class="font-semibold text-slate-900 mt-2 break-all">
                    Loading...
                </p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 mt-8">
                <a href="shop.html" class="flex-1 bg-olive-800 text-white text-center py-3 px-5 rounded-xl 
                    hover:opacity-85 transition-opacity">
                    Continue Shopping
                </a>

                <a href="orders.html" class="flex-1 border border-gray-300 text-slate-900 text-center py-3 px-5 rounded-xl 
                    hover:bg-gray-50 transition-colors">
                    My Orders
                </a>
            </div>
</section>
</main>

<div id="footer"></div>

<script src="./js/header.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/order-success.js"></script>

</body>
</html>
