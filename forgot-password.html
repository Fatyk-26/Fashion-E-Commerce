
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Fashion Store</title>
  <link rel="stylesheet" href="./src/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="min-h-screen bg-stone-50 text-gray-800">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
      <a href="index.html" class="text-2xl font-bold tracking-wide">
        Fashion Store
      </a>

      <a href="login.html" class="text-sm text-gray-600 transition hover:text-black">
        <i class="fa-solid fa-arrow-left mr-2"></i>
        Back to Login
      </a>
    </div>
  </header>

  <main class="flex min-h-[80vh] items-center justify-center px-5 py-12">
    <section class="w-full max-w-md rounded-2xl border border-gray-100 bg-white p-8 shadow-sm sm:p-10">
      <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-full bg-stone-100">
        <i class="fa-solid fa-lock text-xl text-gray-700"></i>
      </div>

      <h1 class="mb-3 text-3xl font-semibold tracking-tight">
        Forgot Password?
      </h1>

      <p class="mb-8 text-sm leading-6 text-gray-500">
        No worries! Enter your email address and we'll send you a password reset code.
      </p>

      <form id="forgot-password-form" class="space-y-5">
        <div>
          <label for="email" class="mb-2 block text-sm font-medium">
            Email Address
          </label>

          <input  type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required 
          class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition 
          focus:border-gray-800 focus:ring-1 focus:ring-gray-800" >
        </div>

        <p  id="message" role="status" aria-live="polite" class="hidden text-sm leading-6">
        </p>

        <button type="submit"  id="send-code-btn" class="w-full rounded-lg bg-gray-900 px-4 py-3
        font-medium text-white transition hover:bg-gray-700 disabled:cursor-not-allowed disabled:opacity-60">
          Send Reset Code
        </button>
      </form>

      <p class="mt-7 text-center text-sm text-gray-500"> Remember your password?
        <a href="login.html" class="font-semibold text-gray-900 hover:underline">
          Log in
        </a>
      </p>

  </section>
</main>

<script src="./js/forgot-password.js"></script>

</body>
</html>
