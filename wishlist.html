<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
<title>Wishlist | Fashion Store</title>
</head>

<body>
<div id="header"></div>
<div id="toast-container"  class="fixed top-24 left-1/2 -translate-x-1/2 z-[6000] flex flex-col gap-3"></div>

<section class="pt-20 pb-20">
    <h2 class="text-center text-3xl p-12 font-semibold">Wishlist Products</h2>
     <div class="flex justify-center mb-6">
    <button
        id="remove-all-wishlist"
        class="border border-gray-300 text-gray-600 px-4 py-2  rounded-full text-sm
            hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition">
        <i class="fa-regular fa-trash-can mr-2"></i>
            Remove All
    </button>
</div>
    <div id="wishlist-products"  class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 rounded-md gap-6 px-4 sm:px-5 lg:px-6" ></div>
    <div id="wishlist-empty" class="hidden text-center py-15">
    <i class="fa-regular fa-heart text-4xl text-gray-700 "></i> 
    <p class="text-xl font-semibold mt-4">Your whishlist is empty</p>
    <p class="text-sm text-gray-500 mt-2">
       Add items you love to your wishlist!
    </p>
</div>
</section>  

<div id="footer"></div>
      
<script src="./js/header.js"></script>
<script src="./js/data.js"></script>
<script src="./js/store.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/wishlist.js"></script>

</body>
</html>
